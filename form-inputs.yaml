appId: com.thiagonunes11.trplayground
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Form Inputs"
    centerElement: true
- tapOn: "Form Inputs"


- tapOn: "Enter your full name"
- inputRandomPersonName
- pressKey: enter

- tapOn: "Enter your email"
- inputRandomEmail
- pressKey: enter
- copyTextFrom:
    id: "form-name-input"
- evalScript: ${output.name = maestro.copiedText}

- tapOn: "Enter your phone number"
- inputRandomNumber:
    length: 8
- pressKey: enter
- copyTextFrom:
    id: "form-email-input"
- evalScript: ${output.email = maestro.copiedText}

- tapOn: "Press Enter here to add a new line"
- inputRandomText:
    length: 8
- pressKey: enter
- inputRandomText:
    length: 8
- pressKey: back


- assertVisible: "Enter pressed: 3"


- scrollUntilVisible:
    element:
      text: "Country"
      index: 1

- tapOn:
    text: "Country"
    index: 1

- tapOn:
    id: "text1"
    index: ${Math.floor(Math.random()*5)+1}

- copyTextFrom:
    id: "text1"
- evalScript: ${output.country = maestro.copiedText}
- assertVisible: "Selected country: ${output.country}"


- scrollUntilVisible:
    element: "Register"
    centerElement: true   # otherwise the button stops behind the gesture bar and the tap is ignored
- tapOn: "Register"


- assertVisible: "${output.name} from ${output.country} registered successfully!"


